# SPIKE-QUALITY-GATE — repository foundation
name: Feature request
description: Propose a complete user workflow and measurable acceptance.
title: ""
body:
  - type: textarea
    id: workflow
    attributes:
      label: User workflow
      description: Explain inputs, outputs and the concrete comparison or diagnostic need.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sources and acceptance
      description: Identify independent references, framework requirements, limits and expected observable outcomes.
    validations:
      required: true
  - type: textarea
    id: integration
    attributes:
      label: Integration and compatibility
      description: Describe existing producers, consumers and affected counterparts.
    validations:
      required: true
