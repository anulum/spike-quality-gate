# SPIKE-QUALITY-GATE — bounded repository workflows

name: Read-only repository analysis
'on':
  push: {}
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  validation:
    name: Read-only repository analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI_JOB_CLASS: analysis
      CI_SOURCE_SCOPE: maintained-python-and-repository
    steps:
    - name: Read the exact source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Analyse with the source-matched immutable image
      uses: docker://ghcr.io/ossf/scorecard-action@sha256:1e1481c65fc2407d3fd6ab18a23c741eb4d1c0d9359ebafc4b3ab13aa61d8627
      env:
        INPUT_RESULTS_FILE: scorecard-results.json
        INPUT_RESULTS_FORMAT: json
        INPUT_REPO_TOKEN: ${{ github.token }}
        INPUT_INTERNAL_DEFAULT_TOKEN: ${{ github.token }}
        INPUT_PUBLISH_RESULTS: 'false'
        INPUT_FILE_MODE: archive
        INPUT_INTERNAL_PUBLISH_BASE_URL: https://api.scorecard.dev
    if: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch) }}
