name: Documentation and native API
'on':
  push: {}
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  UV_LINK_MODE: hardlink
  UV_CACHE_DIR: ${{ github.workspace }}/.tool-cache/uv-cache
  TMPDIR: ${{ github.workspace }}/.tool-cache/tmp
  PRE_COMMIT_HOME: ${{ github.workspace }}/.tool-cache/pre-commit
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  validation:
    name: Documentation and native API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI_JOB_CLASS: documentation
      CI_SOURCE_SCOPE: maintained-python-and-repository
    steps:
    - name: Read the exact source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Prepare local cache directories
      run: mkdir -p .tool-cache/tmp .tool-cache/uv-cache .tool-cache/pre-commit .tool-cache/reports
    - name: Select the verified uv release
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.4
        checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
        python-version: 3.13.16
        python-arch: x86_64
        enable-cache: true
        save-cache: false
        cache-local-path: .tool-cache/uv-cache
        cache-dependency-glob: |-
          requirements-dev.txt
          requirements-rejection.txt
          pyproject.toml
        download-from-astral-mirror: false
    - name: Create the actual tooling environment
      run: |-
        uv venv --python 3.13.16 .venv
        uv pip sync --require-hashes --build-constraints requirements-dev.txt --python .venv/bin/python requirements-dev.txt
    - name: Build the real documentation
      run: make docs
