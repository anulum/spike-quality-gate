[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "node_modules",
    "target",
    ".tool-cache",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "__pycache__",
]
src = ["tools", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "tools"
explicit_package_bases = true
files = ["tools", "tests"]
cache_dir = ".tool-cache/mypy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["tools", "tests"]
parallel = true
sigterm = true
data_file = ".tool-cache/coverage/data"

[tool.coverage.report]
fail_under = 100
show_missing = true
precision = 2
